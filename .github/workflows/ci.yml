name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v5부터 액션 런타임이 node24 — v4(node20)는 러너가 강제 실행하며 경고를 낸다.
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # .dev.vars는 gitignore 대상. e2e가 쓰는 로그인 비번은 테스트용 고정값이고
      # 실제 배포 비번은 Cloudflare secret이므로 여기 평문으로 둬도 무해하다.
      - name: Write .dev.vars
        run: printf 'NEXTJS_ENV=development\nSTELLA_PASSWORD=stella-dev\n' > .dev.vars

      - run: pnpm exec tsc --noEmit

      - run: pnpm lint

      - run: pnpm format:check

      # e2e는 로컬 D1(miniflare)을 쓰므로 스키마를 먼저 적용한다. R2는 빈 상태로 자동 생성.
      - run: pnpm db:migrate:local

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
